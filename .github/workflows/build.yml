name: Build APK

on:
  push:
    branches: [ main, v2-advanced ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Derleme turu"
        required: false
        default: release
        type: choice
        options: [ release, debug, both ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Imza anahtarini hazirla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > prizma.jks
            echo "Imza anahtari hazir."
          else
            echo "KEYSTORE_BASE64 tanimli degil; release imzasiz derlenecek."
          fi

      - name: Release APK derle
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          PRIZMA_KEYSTORE: prizma.jks
          PRIZMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PRIZMA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PRIZMA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Debug APK derle
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Release APK yukle
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: prizma-iptv-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Debug APK yukle
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: prizma-iptv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Derleme raporlarini yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore

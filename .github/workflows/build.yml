name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: NDK ve CMake kur
        run: |
          set -eu
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      # Tum ffmpeg agaci onbellege alinir, yalnizca derlenmis kitapliklar degil.
      # JNI derlemesi configure'un urettigi libavutil/avconfig.h basligina da
      # ihtiyac duyuyor; sadece .a dosyalarini onbelleklemek yetmiyordu.
      - name: FFmpeg onbellegi
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jni/ffmpeg
          key: ffmpeg-6.0-ndk26.1-abi21-audio-v2

      - name: FFmpeg kaynagini al ve derle
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          git clone --depth 1 --branch release/6.0 \
            https://github.com/FFmpeg/FFmpeg.git app/src/main/jni/ffmpeg
          FFMPEG_MODULE_PATH="$(pwd)/app/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          HOST_PLATFORM="linux-x86_64"
          ANDROID_ABI=21
          # media3 MPEG Layer II icin FFmpeg'in mp3 cozucusunu istiyor; mpegaudio
          # ailesinin tamami aciliyor ki Layer I ve II de cozulebilsin.
          ENABLED_DECODERS=(
            mp1 mp1float mp2 mp2float mp3 mp3float
            aac aac_latm ac3 eac3 dca truehd
            alac flac vorbis opus
            pcm_alaw pcm_mulaw pcm_s16le pcm_s16be pcm_s24le
          )
          cd "${FFMPEG_MODULE_PATH}/jni"
          ./build_ffmpeg.sh \
            "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "${HOST_PLATFORM}" \
            "${ANDROID_ABI}" "${ENABLED_DECODERS[@]}"
          rm -rf "${FFMPEG_MODULE_PATH}/jni/ffmpeg/.git"

      - name: FFmpeg kitapliklarini dogrula
        run: |
          set -eu
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for lib in libavcodec.a libavutil.a libswresample.a; do
              f="app/src/main/jni/ffmpeg/android-libs/$abi/$lib"
              test -s "$f" || { echo "EKSIK: $f"; exit 1; }
            done
          done
          test -s "app/src/main/jni/ffmpeg/libavutil/avconfig.h" \
            || { echo "EKSIK: libavutil/avconfig.h (configure calismamis)"; exit 1; }
          echo "Dort mimari icin kitapliklar ve uretilen basliklar hazir."

      - name: Imza anahtarini yaz
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > prizma.jks
            echo "Imza anahtari hazir."
          else
            echo "KEYSTORE_BASE64 tanimli degil, imzasiz derlenecek."
          fi

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: prizma-iptv-apk
          path: app/build/outputs/apk/release/*.apk
